<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CleanCity Nepal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f9f4;
            color: #1b4332;
        }

        nav {
            background: #2d6a4f;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: #52796f;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            background: #2d6a4f;
            color: white;
        }

        .status {
            margin-top: 30px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        footer {
            background: #1b4332;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <h1>🌿 CleanCity Nepal</h1>

        <div>
            <a href="/">Home</a>
            <a href="#">Dashboard</a>
            <a href="#">About</a>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-content">

            <h2>Building a Cleaner Nepal</h2>

            <p>
                CleanCity Nepal is a smart city platform designed to
                improve waste management and create cleaner communities
                through technology and data.
            </p>

            <button onclick="checkBackend()">
                Check Backend
            </button>

            <div class="status">
                <strong>Backend Status:</strong>
                <span id="backendStatus">Not checked</span>
            </div>

        </div>

    </section>

    <footer>
        <p>
            © 2026 CleanCity Nepal | Smart Solutions for a Cleaner Future
        </p>
    </footer>


    <script>

        function checkBackend() {

            document.getElementById("backendStatus").innerText =
                " Checking...";

            fetch("/api/health")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("backendStatus").innerText =
                        " " + data.message;

                })
                .catch(error => {

                    document.getElementById("backendStatus").innerText =
                        " Backend connection failed";

                    console.error(error);

                });
        }

    </script>

</body>
</html>
