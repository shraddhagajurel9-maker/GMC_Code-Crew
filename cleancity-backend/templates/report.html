{% extends "base.html" %}
{% block title %}Report Garbage - CleanCity Nepal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-camera-fill"></i> Report Garbage / Waste Issue
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.report') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" name="title" class="form-control"
                               placeholder="e.g. Overflowing bin near school" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="Describe the issue in detail..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Location</label>
                        <input type="text" name="location" class="form-control"
                               placeholder="e.g. Ward 12, New Baneshwor, Kathmandu" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Photo (optional)</label>
                        <input type="file" name="image" class="form-control"
                               accept="image/png,image/jpeg,image/jpg,image/gif">
                        <div class="form-text">Max 5MB. PNG, JPG, JPEG, GIF only.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-send"></i> Submit Report
                        </button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
