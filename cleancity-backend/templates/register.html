{% extends "base.html" %}
{% block title %}Register - CleanCity Nepal{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="bi bi-person-plus text-success"></i>
                    </h3>
                    <h4 class="text-center mb-4">Create Account</h4>

                    <form method="POST" action="{{ url_for('main.register') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Choose a username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control"
                                       placeholder="your@email.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Choose a password" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">I am a...</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="role" value="citizen" id="roleCitizen" checked>
                                    <label class="form-check-label" for="roleCitizen">
                                        <i class="bi bi-person"></i> Citizen
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="role" value="municipality" id="roleMunicipality">
                                    <label class="form-check-label" for="roleMunicipality">
                                        <i class="bi bi-building"></i> Municipality
                                    </label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-3">
                            <i class="bi bi-person-plus"></i> Create Account
                        </button>
                    </form>

                    <p class="text-center text-muted mb-0">
                        Already have an account?
                        <a href="{{ url_for('main.login') }}" class="text-success fw-bold">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
